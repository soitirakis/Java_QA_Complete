name: UI Tests

on:
  push:
    branches: [main]
    paths:
      - 'Week11/thinking-tester-final/**'
  pull_request:
    branches: [main]
    paths:
      - 'Week11/thinking-tester-final/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        working-directory: Week11/thinking-tester-final
        run: mvn test -Dheadless=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: Week11/thinking-tester-final/target/surefire-reports
