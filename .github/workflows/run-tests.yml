name: UI Tests

on:
  push:
    branches: [main]
    paths:
      - 'Week11/thinking-tester-final/**'
  pull_request:
    branches: [main]
    paths:
      - 'Week11/thinking-tester-final/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run tests
        id: tests
        working-directory: Week11/thinking-tester-final
        run: mvn test -Dheadless=true || echo "TESTS_FAILED=true" >> $GITHUB_ENV

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Copy Allure history
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p Week11/thinking-tester-final/target/allure-results/history
            cp -r gh-pages/history/* Week11/thinking-tester-final/target/allure-results/history/
          fi

      - name: Generate Allure report
        working-directory: Week11/thinking-tester-final
        run: mvn allure:report

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: Week11/thinking-tester-final/target/site/allure-maven-plugin

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: Week11/thinking-tester-final/target/surefire-reports

      - name: Fail job if tests failed
        if: env.TESTS_FAILED == 'true'
        run: exit 1
